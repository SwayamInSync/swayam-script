<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover banner</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; }
  svg { display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1500" height="600" fill="#0b1020"/>
  <rect width="1500" height="600" fill="url(#dots)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <!-- Headline -->
    <text x="115" y="122" font-size="62" font-weight="700" fill="#f3f4f6">Where should the proof live?</text>
    <text x="115" y="170" font-size="26" fill="#9ca3af">Source-level vs binary-level formal verification of C/C++</text>

    <!-- Box 1: frontends -->
    <rect x="115" y="235" width="270" height="220" rx="16" fill="#111832" stroke="#2b3354" stroke-width="2"/>
    <text x="139" y="273" font-size="15" font-weight="600" letter-spacing="1.6" fill="#9ca3af">COMPILE TO C / C++</text>
    <g font-family="'SF Mono', Menlo, monospace" font-size="19" fill="#d1d5db">
      <circle cx="146" cy="310" r="4" fill="#6b7280"/><text x="160" y="316">Python</text>
      <circle cx="146" cy="348" r="4" fill="#6b7280"/><text x="160" y="354">Nim · Vala</text>
      <circle cx="146" cy="386" r="4" fill="#6b7280"/><text x="160" y="392">Lean 4</text>
      <circle cx="146" cy="424" r="4" fill="#6b7280"/><text x="160" y="430">LLM output</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="393" y1="345" x2="447" y2="345" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Box 2: source + contracts (source-level proof) -->
    <rect x="455" y="235" width="400" height="220" rx="16" fill="#0f2a26" stroke="#34d399" stroke-width="2.5"/>
    <text x="481" y="281" font-size="30" font-weight="700" fill="#ecfdf5">C / C++ source</text>
    <text x="481" y="313" font-family="'SF Mono', Menlo, monospace" font-size="20" fill="#34d399">+ contracts</text>
    <g font-family="'SF Mono', Menlo, monospace" font-size="16" fill="#a7f3d0" opacity="0.75">
      <text x="481" y="348">pre(valid(xs, n))</text>
      <text x="481" y="372">modifies(xs[0 : n])</text>
    </g>
    <rect x="481" y="394" width="210" height="40" rx="20" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.6"/>
    <circle cx="503" cy="414" r="11" fill="#34d399"/>
    <path d="M497.5 414.5 L501.5 418.5 L508.5 410" fill="none" stroke="#0b1020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="522" y="420" font-size="18" font-weight="600" fill="#ecfdf5">Proof: Cpp-Verify</text>

    <!-- Arrow 2 (compiler) -->
    <text x="915" y="330" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="17" fill="#9ca3af">clang</text>
    <line x1="863" y1="345" x2="967" y2="345" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Box 3: RISC-V binary (binary-level proof) -->
    <rect x="975" y="235" width="410" height="220" rx="16" fill="#2a1f0b" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="1001" y="281" font-size="30" font-weight="700" fill="#fffbeb">RISC-V binary</text>
    <text x="1001" y="313" font-family="'SF Mono', Menlo, monospace" font-size="20" fill="#f59e0b">ASan + plain build</text>
    <g font-family="'SF Mono', Menlo, monospace" font-size="16" fill="#fde68a" opacity="0.75">
      <text x="1001" y="348">srli t0, a1, 3</text>
      <text x="1001" y="372">bnez t1, asan_report</text>
    </g>
    <rect x="1001" y="394" width="160" height="40" rx="20" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-opacity="0.6"/>
    <circle cx="1023" cy="414" r="11" fill="#f59e0b"/>
    <path d="M1017.5 414.5 L1021.5 418.5 L1028.5 410" fill="none" stroke="#0b1020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1042" y="420" font-size="18" font-weight="600" fill="#fffbeb">Proof: Rocq</text>

    <!-- Captions -->
    <text x="655" y="494" text-anchor="middle" font-size="18" fill="#9ca3af">portable · modular · catches latent UB</text>
    <text x="1180" y="494" text-anchor="middle" font-size="18" fill="#9ca3af">no compiler trust · one platform model</text>

    <!-- Handle -->
    <text x="1385" y="560" text-anchor="end" font-size="18" fill="#6b7280">@swayaminsync</text>
  </g>
</svg>
</body>
</html>
